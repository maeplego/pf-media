# Always-on unit + vuln CI.
# Compose up, Playwright browsers, and Docker Desktop Kubernetes are not in this
# workflow: hosted runners have no Desktop cluster, and image builds are too slow
# for every push. See portfolio-plan/ci.md in the meta repo.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          check-latest: true
          cache-dependency-path: apps/api/go.sum
      - name: unit tests
        working-directory: apps/api
        run: go test ./...
      - name: govulncheck
        working-directory: apps/api
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  processor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/processor/package-lock.json
      - working-directory: apps/processor
        run: npm ci
      - working-directory: apps/processor
        run: npm test
      - working-directory: apps/processor
        run: npm audit --audit-level=high
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0 (pin SHA after 2026-03 tag hijack)
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.4"
      - name: client dry-run of this repo's manifests
        run: kubectl kustomize deploy/k8s | kubectl apply --dry-run=client --validate=false -f -
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate Compose file without starting containers
        run: docker compose -f deploy/compose.yaml config
