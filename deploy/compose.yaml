services:
  media-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media
      POSTGRES_DB: media
    volumes:
      - media-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d media"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${MEDIA_S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${MEDIA_S3_BUCKET}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "3900:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ../apps/api
    environment:
      MEDIA_HTTP_ADDR: ":8090"
      MEDIA_DATABASE_URL: ${MEDIA_DATABASE_URL}
      MEDIA_REDIS_URL: ${MEDIA_REDIS_URL}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT}
      MEDIA_S3_PUBLIC_ENDPOINT: ${MEDIA_S3_PUBLIC_ENDPOINT:-localhost:3900}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-garage}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET}
      MEDIA_PROCESSOR_TOKEN: ${MEDIA_PROCESSOR_TOKEN}
      MEDIA_DEV_AUTH: ${MEDIA_DEV_AUTH:-true}
      MEDIA_QUOTA_BYTES: ${MEDIA_QUOTA_BYTES}
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES}
    ports:
      - "8090:8090"
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      media-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy

  processor:
    build:
      context: ../apps/processor
    environment:
      MEDIA_REDIS_URL: ${MEDIA_REDIS_URL}
      MEDIA_API_URL: http://api:8090
      MEDIA_PROCESSOR_TOKEN: ${MEDIA_PROCESSOR_TOKEN}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-garage}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY}
    depends_on:
      - api
      - redis
      - garage

  web:
    build:
      context: ../apps/web
    environment:
      MEDIA_API_URL: http://api:8090
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "3004:3004"
    depends_on:
      - api

volumes:
  media-pg:
  garage-meta:
  garage-data:
