services:
  media-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media
      POSTGRES_DB: media
    volumes:
      - media-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d media"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_MINIO_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${MEDIA_MINIO_SECRET_KEY:-minio12345}
      MINIO_SERVER_URL: http://localhost:9000
    ports:
      - "9000:9000"
      - "8091:9001"
    volumes:
      - media-minio:/data

  api:
    build:
      context: ../apps/api
    environment:
      MEDIA_HTTP_ADDR: ":8090"
      MEDIA_DATABASE_URL: ${MEDIA_DATABASE_URL}
      MEDIA_REDIS_URL: ${MEDIA_REDIS_URL}
      MEDIA_MINIO_ENDPOINT: ${MEDIA_MINIO_ENDPOINT}
      MEDIA_MINIO_PUBLIC_ENDPOINT: ${MEDIA_MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MEDIA_MINIO_ACCESS_KEY: ${MEDIA_MINIO_ACCESS_KEY}
      MEDIA_MINIO_SECRET_KEY: ${MEDIA_MINIO_SECRET_KEY}
      MEDIA_MINIO_BUCKET: ${MEDIA_MINIO_BUCKET}
      MEDIA_PROCESSOR_TOKEN: ${MEDIA_PROCESSOR_TOKEN}
      MEDIA_DEV_AUTH: ${MEDIA_DEV_AUTH:-true}
      MEDIA_QUOTA_BYTES: ${MEDIA_QUOTA_BYTES}
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES}
    ports:
      - "8090:8090"
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      media-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  processor:
    build:
      context: ../apps/processor
    environment:
      MEDIA_REDIS_URL: ${MEDIA_REDIS_URL}
      MEDIA_API_URL: http://api:8090
      MEDIA_PROCESSOR_TOKEN: ${MEDIA_PROCESSOR_TOKEN}
      MEDIA_MINIO_ENDPOINT: ${MEDIA_MINIO_ENDPOINT}
      MEDIA_MINIO_ACCESS_KEY: ${MEDIA_MINIO_ACCESS_KEY}
      MEDIA_MINIO_SECRET_KEY: ${MEDIA_MINIO_SECRET_KEY}
    depends_on:
      - api
      - redis
      - minio

  web:
    build:
      context: ../apps/web
    environment:
      MEDIA_API_URL: http://api:8090
    ports:
      - "3004:3004"
    depends_on:
      - api

volumes:
  media-pg:
  media-minio:
