apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: media-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-api
  template:
    metadata:
      labels:
        app: media-api
    spec:
      containers:
        - name: api
          image: pf-media-api:latest
          ports:
            - containerPort: 8090
          env:
            - name: MEDIA_HTTP_ADDR
              value: :8090
            - name: MEDIA_S3_REGION
              value: garage
            - name: MEDIA_S3_BUCKET
              value: media
            - name: MEDIA_S3_ACCESS_KEY
              value: GKdevmedia00000001
            - name: MEDIA_S3_SECRET_KEY
              value: dev-media-secret-key-for-local-k8s-demo
            - name: MEDIA_PROCESSOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: p03-secrets
                  key: MEDIA_PROCESSOR_TOKEN
            - name: MEDIA_QUOTA_BYTES
              value: "104857600"
            - name: MEDIA_MAX_UPLOAD_BYTES
              value: "20971520"
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 10
